[project]
name = "minispec"
version = "0.1.0"
description = "Example python library to control the IS Instruments MSP1000 miniature spectrometer."
readme = "README.md"
authors = [
    {name = "Josh Veitch-Michaelis"}
]
maintainers = [
    {name = "Charles Warren"}
]
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.19.5",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
